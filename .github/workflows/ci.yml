name: CI

on:
  pull_request:
    branches:
      - Dev
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p app
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "google-services.json restored successfully."
          else
            echo "WARNING: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Build, Tests, and Lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
